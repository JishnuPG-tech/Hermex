name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_SPACE: Jishnupg/Hermes

    steps:
      - name: Checkout Hermex without downloading Git LFS blobs
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Build Git LFS exclusion list
        run: |
          set -euxo pipefail
          git lfs install --local
          git lfs ls-files -n > /tmp/lfs-excludes.txt
          echo "LFS paths kept on Hugging Face:"
          cat /tmp/lfs-excludes.txt || true

      - name: Verify HF token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euxo pipefail
          test -n "${HF_TOKEN:-}"

      - name: Clone Hugging Face Space without LFS checkout
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euxo pipefail
          rm -rf /tmp/hf-space
          GIT_LFS_SKIP_SMUDGE=1 git -c filter.lfs.smudge= -c filter.lfs.required=false clone --no-checkout "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git" /tmp/hf-space
          git -C /tmp/hf-space rev-parse HEAD

      - name: Checkout Hugging Face working tree without LFS download
        run: |
          set -euxo pipefail
          cd /tmp/hf-space
          GIT_LFS_SKIP_SMUDGE=1 git -c filter.lfs.smudge= -c filter.lfs.required=false checkout --force
          git status --short

      - name: Copy non-LFS GitHub files
        run: |
          set -euxo pipefail
          rsync -av --delete             --exclude '.git/'             --exclude '.github/'             --exclude-from=/tmp/lfs-excludes.txt             "${GITHUB_WORKSPACE}/" /tmp/hf-space/

      - name: Commit and push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GIT_LFS_SKIP_PUSH: "1"
        run: |
          set -euxo pipefail
          cd /tmp/hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config lfs.allowincompletepush true

          git add -A
          git status --short

          if git diff --cached --quiet; then
            echo "Hugging Face Space is already synchronized."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "Sync Hermex from GitHub ${GITHUB_SHA}"

          # This mirror intentionally updates only non-LFS files.
          rm -f .git/hooks/pre-push

          GIT_LFS_SKIP_PUSH=1 git push --no-verify origin HEAD:main
