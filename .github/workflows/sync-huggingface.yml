name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_SPACE: Jishnupg/Hermes

    steps:
      - name: Checkout Hermex without downloading Git LFS blobs
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Upload non-LFS files through Hugging Face API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"

          python -m pip install --disable-pip-version-check -q huggingface_hub

          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          root = Path(os.environ["GITHUB_WORKSPACE"])
          lfs_file = Path("/tmp/lfs-excludes.txt")

          os.system("git lfs install --local")
          lfs_paths = []
          for line in os.popen("git lfs ls-files -n"):
              p = line.strip()
              if p:
                  lfs_paths.append(p)

          print(f"Found {len(lfs_paths)} Git LFS paths")
          for p in lfs_paths:
              print(f"Keeping existing HF file: {p}")

          api = HfApi(token=os.environ["HF_TOKEN"])

          ignore_patterns = [
              ".git/**",
              ".github/**",
              *lfs_paths,
          ]

          api.upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path=str(root),
              ignore_patterns=ignore_patterns,
              commit_message=f"Sync Hermex from GitHub {os.environ['GITHUB_SHA']}",
          )
          print("Hugging Face API sync completed")
          PY
